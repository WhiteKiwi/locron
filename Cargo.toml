[workspace]
members = [
    "crates/locron-core",
    "crates/locron-store",
    "crates/locron-engine",
    "crates/locron-server",
    "crates/locron-cli",
]
resolver = "3"

[workspace.package]
version = "0.7.0"
edition = "2024"
rust-version = "1.94"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WhiteKiwi/locron"
authors = ["WhiteKiwi"]

[workspace.dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.23"
blake3 = "1.8"
clap = { version = "4.5", features = ["derive", "env"] }
crc32fast = "1.5"
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"] }
futures-util = "0.3"
jiff = { version = "0.2", features = ["serde"] }
nix = { version = "0.31", features = ["process", "signal"] }
proptest = "1.9"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "stream", "json"] }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = { version = "0.10", default-features = false, features = ["std"] }
tar = { version = "0.4", default-features = false }
tempfile = "3.24"
thiserror = "2.0"
tokio = { version = "1.49", features = ["rt-multi-thread", "macros", "time", "process", "signal", "net", "sync", "io-util", "fs", "io-std"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2.5", features = ["serde"] }
uuid = { version = "1.21", features = ["v7", "serde"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
default_trait_access = "allow"
doc_markdown = "allow"
match_same_arms = "allow"
missing_errors_doc = "allow"
large_enum_variant = "allow"
semicolon_if_nothing_returned = "allow"
similar_names = "allow"
too_many_lines = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
