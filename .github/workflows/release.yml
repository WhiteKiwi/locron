name: Release

on:
  push:
    tags:
      - 'v*.*.*'

jobs:
  build:
    name: Build / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p locron
      - name: Package tarball archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_DIR="locron-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp target/release/locron "${ARCHIVE_DIR}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${ARCHIVE_DIR}/"
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
      - name: Build Linux packages (.deb and .rpm)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Generate Debian and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo deb -p locron --no-build
          cp target/debian/*.deb .
          cargo generate-rpm -p crates/locron-cli
          cp target/generate-rpm/*.rpm .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            locron-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            *.deb
            *.rpm
          if-no-files-found: warn

  publish-crates:
    name: Publish crates.io workspace
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: crates-io
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.94.0
      - name: Verify release version agreement
        run: sh scripts/check-release-version.sh "${GITHUB_REF_NAME#v}"
      - name: Inventory exact crate versions
        id: inventory
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          state=$(sh scripts/crates-version-inventory.sh "$VERSION")
          echo "state=$state" >> "$GITHUB_OUTPUT"
      - name: Authenticate to crates.io
        if: steps.inventory.outputs.state == 'none'
        id: auth
        uses: rust-lang/crates-io-auth-action@v1
      - name: Publish workspace
        if: steps.inventory.outputs.state == 'none'
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: cargo publish --workspace --locked
      - name: Verify complete registry inventory
        run: sh scripts/crates-version-inventory.sh "${GITHUB_REF_NAME#v}" | grep -qx all
      - name: Install and verify registry package
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          INSTALL_ROOT="$RUNNER_TEMP/locron-cargo-install"
          cargo install --locked --version "=$VERSION" --root "$INSTALL_ROOT" locron
          test "$("$INSTALL_ROOT/bin/locron" -V)" = "locron $VERSION"
          set +e
          output=$(LOCRON_UPDATE_API_BASE=http://127.0.0.1:1 "$INSTALL_ROOT/bin/locron" --json self-update)
          status=$?
          set -e
          test "$status" -eq 3
          printf '%s' "$output" | jq -e '.error.code == "update_unowned_install"'
          LOCRON_STATE_DIR="$RUNNER_TEMP/locron-state" "$INSTALL_ROOT/bin/locron" service status
          LOCRON_STATE_DIR="$RUNNER_TEMP/locron-state" "$INSTALL_ROOT/bin/locron" dashboard status

  publish:
    name: Publish GitHub Release
    needs: [build, publish-crates]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Checksums
        working-directory: artifacts
        run: |
          sha256sum ./*.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Extract Release Notes
        run: |
          # Release notes come from the curated section of CHANGELOG.md for the
          # tagged version (docs/RELEASE.md "Changelog Maintenance" policy). The
          # checkout is the tagged commit, where the release procedure committed
          # the generated-and-curated entry.
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="## [${VERSION}]" '
              index($0, ver) == 1 { in_section = 1; next }
              in_section && /^## \[/ { exit }
              in_section { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "release notes: $(wc -l < release-notes.md) lines"
          else
            echo "no changelog section for ${GITHUB_REF_NAME}; falling back to generated notes"
          fi
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/SHA256SUMS.txt \
              install.sh \
              --clobber
            [ -s release-notes.md ] && gh release edit "${GITHUB_REF_NAME}" --notes-file release-notes.md
          else
            NOTES_ARGS=(--generate-notes)
            [ -s release-notes.md ] && NOTES_ARGS=(--notes-file release-notes.md)
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/SHA256SUMS.txt \
              install.sh \
              --title "locron ${GITHUB_REF_NAME}" \
              "${NOTES_ARGS[@]}"
          fi
      - name: Update Homebrew Tap Formula
        # Note: keep this env-based. Referencing a secret directly inside a
        # step `if:` makes GitHub Actions fail workflow evaluation entirely,
        # producing zero-job phantom runs on every push instead of real runs.
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_MACOS_SHA=$(sha256sum "artifacts/locron-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz" | awk '{print $1}')
          X86_MACOS_SHA=$(sha256sum "artifacts/locron-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz" | awk '{print $1}')
          ARM64_LINUX_SHA=$(sha256sum "artifacts/locron-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz" | awk '{print $1}')
          X86_LINUX_SHA=$(sha256sum "artifacts/locron-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz" | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/WhiteKiwi/homebrew-tap.git" tap-repo
          cd tap-repo

          sh "${GITHUB_WORKSPACE}/scripts/render-homebrew-formula.sh" \
            "${VERSION}" \
            "${ARM64_MACOS_SHA}" \
            "${X86_MACOS_SHA}" \
            "${ARM64_LINUX_SHA}" \
            "${X86_LINUX_SHA}" \
            > Formula/locron.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/locron.rb
          if git diff --staged --quiet; then
            echo "Formula is already up-to-date"
          else
            git commit -m "bump(locron): ${VERSION}"
            git push origin main
          fi
