name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build / ${{ matrix.target }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-apple-darwin
            os: macos-14
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-24.04
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-24.04-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@v2
      - name: Build release binary
        run: cargo build --release --locked -p locron-cli
      - name: Package tarball archive
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME}"
          ARCHIVE_DIR="locron-${VERSION}-${{ matrix.target }}"
          mkdir -p "${ARCHIVE_DIR}"
          cp target/release/locron "${ARCHIVE_DIR}/"
          cp README.md LICENSE-MIT LICENSE-APACHE "${ARCHIVE_DIR}/"
          tar -czvf "${ARCHIVE_DIR}.tar.gz" "${ARCHIVE_DIR}"
      - name: Build Linux packages (.deb and .rpm)
        if: runner.os == 'Linux'
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb,cargo-generate-rpm
      - name: Generate Debian and RPM packages
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo deb -p locron-cli --no-build
          cp target/debian/*.deb .
          cargo generate-rpm -p crates/locron-cli
          cp target/generate-rpm/*.rpm .
      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.target }}
          path: |
            locron-${{ github.ref_name }}-${{ matrix.target }}.tar.gz
            *.deb
            *.rpm
          if-no-files-found: warn

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true
      - name: Generate Checksums
        working-directory: artifacts
        run: |
          sha256sum *.* > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Create GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            echo "Release ${GITHUB_REF_NAME} already exists; uploading assets"
            gh release upload "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/SHA256SUMS.txt \
              --clobber
          else
            gh release create "${GITHUB_REF_NAME}" \
              artifacts/*.tar.gz \
              artifacts/*.deb \
              artifacts/*.rpm \
              artifacts/SHA256SUMS.txt \
              --title "locron ${GITHUB_REF_NAME}" \
              --generate-notes
          fi
      - name: Update Homebrew Tap Formula
        # Note: keep this env-based. Referencing a secret directly inside a
        # step `if:` makes GitHub Actions fail workflow evaluation entirely,
        # producing zero-job phantom runs on every push instead of real runs.
        if: env.TAP_TOKEN != ''
        env:
          TAP_TOKEN: ${{ secrets.TAP_GITHUB_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          ARM64_MACOS_SHA=$(sha256sum artifacts/locron-${GITHUB_REF_NAME}-aarch64-apple-darwin.tar.gz | awk '{print $1}')
          X86_MACOS_SHA=$(sha256sum artifacts/locron-${GITHUB_REF_NAME}-x86_64-apple-darwin.tar.gz | awk '{print $1}')
          ARM64_LINUX_SHA=$(sha256sum artifacts/locron-${GITHUB_REF_NAME}-aarch64-unknown-linux-gnu.tar.gz | awk '{print $1}')
          X86_LINUX_SHA=$(sha256sum artifacts/locron-${GITHUB_REF_NAME}-x86_64-unknown-linux-gnu.tar.gz | awk '{print $1}')

          git clone "https://x-access-token:${TAP_TOKEN}@github.com/WhiteKiwi/homebrew-tap.git" tap-repo
          cd tap-repo

          cat <<EOF > Formula/locron.rb
          class Locron < Formula
            desc "Local-first job scheduler for macOS and Linux"
            homepage "https://github.com/WhiteKiwi/locron"
            version "${VERSION}"
            license any_of: ["MIT", "Apache-2.0"]

            on_macos do
              if Hardware::CPU.arm?
                url "https://github.com/WhiteKiwi/locron/releases/download/v#{version}/locron-v#{version}-aarch64-apple-darwin.tar.gz"
                sha256 "${ARM64_MACOS_SHA}"
              else
                url "https://github.com/WhiteKiwi/locron/releases/download/v#{version}/locron-v#{version}-x86_64-apple-darwin.tar.gz"
                sha256 "${X86_MACOS_SHA}"
              end
            end

            on_linux do
              if Hardware::CPU.arm?
                url "https://github.com/WhiteKiwi/locron/releases/download/v#{version}/locron-v#{version}-aarch64-unknown-linux-gnu.tar.gz"
                sha256 "${ARM64_LINUX_SHA}"
              else
                url "https://github.com/WhiteKiwi/locron/releases/download/v#{version}/locron-v#{version}-x86_64-unknown-linux-gnu.tar.gz"
                sha256 "${X86_LINUX_SHA}"
              end
            end

            def install
              bin.install "locron"
            end

            test do
              assert_match "locron", shell_output("#{bin}/locron --version")
            end
          end
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/locron.rb
          if git diff --staged --quiet; then
            echo "Formula is already up-to-date"
          else
            git commit -m "bump(locron): ${VERSION}"
            git push origin main
          fi
