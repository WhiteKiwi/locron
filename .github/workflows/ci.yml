name: Windows native per-binary discovery

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native-binary-discovery:
    name: Windows binary discovery / ${{ matrix.platform }} / Rust ${{ matrix.rust }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-pc-windows-msvc
            os: windows-2025
            rust: stable
          - platform: aarch64-pc-windows-msvc
            os: windows-11-arm
            rust: stable
          - platform: x86_64-pc-windows-msvc
            os: windows-2025
            rust: 1.94.0
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: Verify requested native compiler
        id: compiler
        shell: pwsh
        run: |
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw 'rustc facts unavailable' }
          $compiler | Write-Output
          $requestedCompiler = rustup run '${{ matrix.rust }}' rustc -vV
          if ($LASTEXITCODE -ne 0) { throw 'requested toolchain facts unavailable' }
          $requestedRelease = @($requestedCompiler | Where-Object { $_ -clike 'release: *' })
          if ($requestedRelease.Count -ne 1 -or $compiler -cnotcontains $requestedRelease[0]) { throw 'actual compiler must match requested toolchain release' }
          if ($compiler -cnotcontains 'host: ${{ matrix.platform }}') { throw 'test target must equal native rustc host' }
      - name: Verify dashboard / doctor_reports_the_dashboard_exposure_facts
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test -p locron --test dashboard --locked doctor_reports_the_dashboard_exposure_facts -- --exact 2>&1 | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if (-not ($testOutput -cmatch '^running 1 test$') -or -not ($testOutput -cmatch '^test doctor_reports_the_dashboard_exposure_facts \.\.\. ok$')) { throw 'exact selection must execute one passing named test' }
      - name: Verify service / lifecycle_human_modes_render_labeled_reports_instead_of_json
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test -p locron --test service --locked lifecycle_human_modes_render_labeled_reports_instead_of_json -- --exact 2>&1 | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if (-not ($testOutput -cmatch '^running 1 test$') -or -not ($testOutput -cmatch '^test lifecycle_human_modes_render_labeled_reports_instead_of_json \.\.\. ok$')) { throw 'exact selection must execute one passing named test' }
      - name: Verify service / dashboard_status_reports_service_state_url_and_token_facts
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        shell: pwsh
        run: |
          cargo test -p locron --test service --locked dashboard_status_reports_service_state_url_and_token_facts -- --exact 2>&1 | Tee-Object -Variable testOutput
          $testExitCode = $LASTEXITCODE
          if ($testExitCode -ne 0) { exit $testExitCode }
          if (-not ($testOutput -cmatch '^running 1 test$') -or -not ($testOutput -cmatch '^test dashboard_status_reports_service_state_url_and_token_facts \.\.\. ok$')) { throw 'exact selection must execute one passing named test' }
      - name: Discover every default-feature workspace test binary
        if: ${{ !cancelled() && steps.compiler.outcome == 'success' }}
        run: cargo test --workspace --all-targets --locked --no-fail-fast
