              require(set(data["revision"]) == {"head", "tree"} and all(re.fullmatch(r"[0-9a-f]{40}", value) for value in data["revision"].values()), "closed-revision")
              for name, test in (("production", False), ("recovery", True)):
                  record = data[name]
                  require(set(record) == {"path", "sha256", "size", "profile_test"} and record["profile_test"] is test and re.fullmatch(r"[0-9a-f]{64}", record["sha256"]) and type(record["size"]) is int and 0 < record["size"] <= 512 * 1024 * 1024, "closed-artifact-record")
              require(data["production"]["path"] != data["recovery"]["path"], "distinct-artifacts")


          def bind_again(binding, host):
              for name in ("production", "recovery"):
                  actual, _ = facts(binding[name]["path"], host)
                  require(all(actual[field] == binding[name][field] for field in ("path", "sha256", "size")), "independent-binding-recheck")
          def main():
              require(ROOT.is_dir(), "actual-producer-receipt-directory")
              key, host = native_host()
              selected_revision, checkout = revision()
              production_path = pathlib.Path(os.environ["LOCRON_PRUNE_TEST_BINARY"])
              recovery_path = pathlib.Path(os.environ["LOCRON_PRUNE_RECOVERY_TEST_BINARY"])
              require(production_path.parent.name == "debug", "default-production-binding-locator")
              locator = production_path.parent.parent / "prune-artifact-binding.json"
              binding, binding_bytes, binding_id, binding_sha = binding_json_facts(production_path, recovery_path, host, selected_revision)
              checked_records(binding)
              require(binding["revision"] == selected_revision and binding["production"]["path"] == str(production_path) and binding["recovery"]["path"] == str(recovery_path), "actual-binding-revision")
              prod, prod_id = facts(production_path, host)
              rec, rec_id = facts(recovery_path, host)
              bind_again(binding, host)
              data = metadata("scoped-metadata")
              target = pathlib.Path(data["target_directory"]).resolve(strict=True)
              recovery_path.resolve(strict=True).relative_to(target)
              status, messages, _ = invoke(["cargo", "test", "-p", "locron-server", "--lib", "--locked", "--no-run", "--message-format=json"], "server-build")
              require(status == 0, "server-build-status")
              server = artifact(messages, package(data, "locron-server"), "locron_server", "lib", True)
              server_path = pathlib.Path(server["executable"])
              server_path.resolve(strict=True).relative_to(target)
              server_facts, server_id = facts(server_path, host)
              ledger_bytes = bounded(pathlib.Path("docs/planning/GROUP_B_PRUNE_QUALIFICATION_ROWS_2026-10-05.json"), 128 * 1024)
              require(hashlib.sha256(ledger_bytes).hexdigest() == "2f3e1e88f4cb1bc954993287d726a3b442d3fad922f60ce0462f88211557d3a5", "frozen-prune94")
              ledger = json.loads(ledger_bytes)
              captures = {}
              completed = []
              for surface, path, selector in (("api", server_path, "api::prune_output::qualification::contracts"), ("cli", recovery_path, "prune_qualification::contracts")):
                  bind_again(binding, host)
                  status, out, err = invoke([str(path), "--exact", selector, "--nocapture"], surface + "-tests")
                  text = out.decode("utf-8")
                  totals(text, 1)
                  require(status == 0, "actual-prune-driver-status")
                  rows = [row for row in ledger["rows"] if row["surface"] == surface and row["platforms"] in ("all", "windows" if key == "windows" else "unix")]
                  expected = {row["id"] for row in rows}
                  observed = collections.Counter(re.findall(r"prune-qualification PASS ([A-Za-z0-9_-]+)", text))
                  require(set(observed) == expected and len(expected) == len(rows) and all(value == 1 for value in observed.values()), "exact-prune-key-union")
                  require(text.count("prune-qualification FI07-RECEIPT " + surface + " passed=1 failed=0 ignored=0 measured=0 actions=1 outputs_pruned=1 cleanup=1") == 1, "actual-one-test-recovery-proof")
                  if key == "windows":
                      require(text.count("prune-qualification CONTROL " + surface + " N07 helper-finish-positive") == 1, "actual-N07-helper-positive")
                  captures[surface] = {"selector": selector, "actual_status": status, "keys": sorted(observed), "stdout_sha256": hashlib.sha256(out).hexdigest(), "stderr_sha256": hashlib.sha256(err).hexdigest(), "recovery_support": {"passed": 1, "failed": 0, "ignored": 0, "measured": 0}}
                  completed.extend(observed)
                  bind_again(binding, host)
              require(len(completed) == {"linux": 86, "macos": 86, "windows": 88}[key] and len(set(completed)) == len(completed), "exact-platform94-subset")
              prod_after, prod_id_after = facts(production_path, host)
              rec_after, rec_id_after = facts(recovery_path, host)
              server_after, server_id_after = facts(server_path, host)
              after_binding, after_binding_bytes, after_binding_id, after_binding_sha = binding_json_facts(production_path, recovery_path, host, selected_revision)
              require((prod, prod_id, rec, rec_id, server_facts, server_id) == (prod_after, prod_id_after, rec_after, rec_id_after, server_after, server_id_after), "whole-artifacts-conserved")
              require(binding == after_binding and binding_id == after_binding_id and binding_bytes == after_binding_bytes and binding_sha == after_binding_sha, "binding-identity-bytes-conserved")
              receipt = {"revision": selected_revision, "checkout": checkout, "native_host": host, "production": prod, "recovery": rec, "server": server_facts, "production_identity": prod_id, "recovery_identity": rec_id, "server_identity": server_id, "server_artifact": server, "binding_sha256": binding_sha, "binding_identity": binding_id, "ledger_sha256": hashlib.sha256(ledger_bytes).hexdigest(), "drivers": captures, "completed_keys": sorted(completed)}
              (ROOT / "prune94.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("prune94-receipt PASS keys=" + str(len(completed)) + " drivers=2 recovery_support=2")


          try:
              main()
          except Exception as error:
              print("prune94-receipt FAIL phase=" + PHASE + " kind=" + type(error).__name__, file=sys.stderr)
              sys.exit(ACTUAL_STATUS if ACTUAL_STATUS not in (None, 0) else 1)
          '@
          $program | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload actual prune and state qualification receipts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: prune-full-${{ matrix.platform }}-rust-${{ matrix.rust }}
          if-no-files-found: error
          retention-days: 14
          path: prune-qualification/

  windows-full-clippy:
    name: Windows exploratory Clippy / ${{ matrix.platform }} / Rust 1.98.0
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.full_windows }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-pc-windows-msvc
            os: windows-2025
          - platform: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: Verify requested native compiler
        shell: pwsh
        run: |
          $compiler = rustc -vV
          if ($LASTEXITCODE -ne 0) { throw 'rustc facts unavailable' }
          $compiler | Write-Output
          if ($compiler -cnotcontains 'release: 1.98.0') { throw 'full Clippy requires Rust 1.98.0' }
          if ($compiler -cnotcontains 'host: ${{ matrix.platform }}') { throw 'Clippy target must equal native rustc host' }
      - name: Run warnings-denied full native workspace Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_windows }}
    name: ${{ matrix.runner.platform }} / Rust ${{ matrix.rust }}
    timeout-minutes: 30
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - rust: stable
            runner:
              platform: linux-x86_64
              os: ubuntu-24.04
          - rust: stable
            runner:
              platform: linux-aarch64
              os: ubuntu-24.04-arm
          - rust: stable
            runner:
              platform: macos-x86_64
              os: macos-15-intel
          - rust: stable
            runner:
              platform: macos-aarch64
              os: macos-14
          - rust: 1.94.0
            runner:
              platform: linux-x86_64
              os: ubuntu-24.04
    runs-on: ${{ matrix.runner.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
