name: CI

on:
  workflow_dispatch:
    inputs:
      full_windows:
        description: Run exploratory full native Windows tests and Clippy
        type: boolean
        required: false
        default: false
  push:
    branches:
      - diagnostic/windows-gated-heartbeat-qualification

permissions:
  contents: read

jobs:
  windows-lifecycle-cause:
    if: ${{ github.ref == 'refs/heads/diagnostic/windows-gated-heartbeat-qualification' && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.full_windows)) }}
    name: Windows lifecycle cause / x86_64-pc-windows-msvc / Rust stable
    timeout-minutes: 35
    runs-on: windows-2025
    env:
      RUSTUP_TOOLCHAIN: stable
      PROBE_EXPECTED_HEAD: ${{ github.sha }}
      PROBE_OBSERVATION_REVISION: 83ce1b6b9b1be9e38f6cf0a31b92e23f05b2e231
      PROBE_OBSERVATION_TREE: 5c170cdcdc51c9f59cee93c56418a3269199c55d
      PROBE_LIFECYCLE_BLOB: 9658483ff0697388b2a0d1ea9a1cc9fdda8eb4fc
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - uses: dtolnay/rust-toolchain@v1
        with:
          toolchain: 1.98.0
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: false
      - name: Build, bind, and observe the complete native lifecycle suite
        shell: python
        run: |
          import hashlib
          import json
          import os
          import pathlib
          import re
          import subprocess
          import sys
          import time

          root = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve()
          receipts = pathlib.Path(os.environ["RUNNER_TEMP"]) / "lifecycle-cause-probe"
          receipts.mkdir(parents=True, exist_ok=False)
          os.chdir(root)
          state = {
              "schema": 1,
              "purpose": "cause_capture_only",
              "status": "in_progress",
              "phase": "source_admission",
              "maximum_iterations": 50,
              "default_test_parallelism": True,
              "iterations": [],
          }

          def save():
              (receipts / "probe.json").write_text(
                  json.dumps(state, sort_keys=True, indent=2) + "\n", encoding="utf-8"
              )

          def require(condition, phase):
              if not condition:
                  raise RuntimeError(phase)

          def command(args):
              result = subprocess.run(args, cwd=root, capture_output=True, check=False)
              require(result.returncode == 0, "source_or_toolchain_observation")
              return result.stdout.decode("utf-8").strip()

          def file_facts(path):
              require(path.is_file(), "artifact_regular_file")
              size = path.stat().st_size
              require(0 < size <= 2 * 1024 * 1024 * 1024, "artifact_size")
              digest = hashlib.sha256()
              total = 0
              with path.open("rb") as stream:
                  while part := stream.read(1024 * 1024):
                      total += len(part)
                      require(total <= size, "artifact_growth")
                      digest.update(part)
              require(total == size == path.stat().st_size, "artifact_length")
              return {"size": size, "sha256": digest.hexdigest()}

          def logged(args, name, env=None):
              result = subprocess.run(
                  args, cwd=root, env=env, capture_output=True, check=False
              )
              (receipts / (name + ".stdout")).write_bytes(result.stdout)
              (receipts / (name + ".stderr")).write_bytes(result.stderr)
              return result

          def emit(result):
              sys.stdout.write(result.stdout.decode("utf-8", errors="replace"))
              sys.stderr.write(result.stderr.decode("utf-8", errors="replace"))
              sys.stdout.flush()
              sys.stderr.flush()

          def integrity():
              require(command(["git", "rev-parse", "HEAD"]) == state["probe_head"], "head_changed")
              require(
                  command(["git", "rev-parse", "HEAD^{tree}"]) == state["probe_tree"],
                  "tree_changed",
              )
              require(
                  not command(["git", "status", "--porcelain", "--untracked-files=all"]),
                  "source_not_clean",
              )
              for role, artifact in state.get("artifacts", {}).items():
                  require(
                      file_facts(pathlib.Path(artifact["executable"])) == artifact["facts"],
                      role + "_artifact_changed",
                  )

          def select_artifact(result, target_name, target_kind, profile_test, package_id, target_root):
              matches = []
              for line in result.stdout.decode("utf-8").splitlines():
                  message = json.loads(line)
                  if (
                      message.get("reason") == "compiler-artifact"
                      and message.get("package_id") == package_id
                      and message.get("target", {}).get("name") == target_name
                      and message["target"].get("kind") == [target_kind]
                      and message.get("profile", {}).get("test") is profile_test
                      and message.get("executable")
                  ):
                      matches.append(message)
              require(len(matches) == 1, "unique_cargo_artifact")
              selected = matches[0]
              require(selected.get("features") == [], "artifact_features")
              executable = pathlib.Path(selected["executable"]).resolve(strict=True)
              require(executable.is_relative_to(target_root), "artifact_target_directory")
              return {
                  "package_id": selected["package_id"],
                  "target": selected["target"],
                  "profile": selected["profile"],
                  "features": selected["features"],
                  "executable": str(executable),
                  "facts": file_facts(executable),
              }

          expected_tests = {
              "native_heartbeat_snapshot_target",
              "hard_stopping_an_unpublished_heartbeat_preserves_the_last_complete_counter",
              "native_descendant_target",
              "native_process_target",
              "cancelling_a_waiting_activation_preserves_the_manual_daemon",
              "activation_automatically_takes_ownership_after_the_manual_daemon_exits",
              "registered_daemon_crash_kills_live_tree_and_recovers_one_unknown_run_without_retry",
              "duplicate_registered_activation_and_stale_control_lifetime_are_refused",
              "invalid_supervised_daemon_arguments_never_create_child_state",
              "stale_supervisor_uuid_cannot_create_a_daemon_worker_lease",
              "exact_daemon_worker_cancellation_preserves_the_parent_and_manual_scheduler",
              "supervised_daemon_activates_with_its_worker_uuid_after_the_manual_owner_exits",
              "first_run_registered_daemon_explicitly_creates_private_state_before_control",
              "first_run_registered_dashboard_explicitly_creates_private_state_before_control",
              "actual_dashboard_exit_closes_active_sse_while_a_native_job_continues",
              "actual_dashboard_exit_is_bounded_with_idle_http_clients",
              "heartbeat_failure_observation::observes_one_fragmented_stderr_record_as_typed_fields",
              "heartbeat_failure_observation::malformed_duplicate_partial_and_wrong_channel_records_stay_unobserved",
              "heartbeat_failure_observation::corrupt_truncated_oversized_missing_and_refused_frames_stay_unobserved",
              "gated_heartbeat_retry::held_refusal_releases_the_exact_handle_and_publishes_the_same_candidate",
              "gated_heartbeat_retry::permanent_held_refusal_exhausts_one_hundred_ms_admission_without_replacing_old_counter",
              "gated_heartbeat_retry::expired_retry_returns_the_real_refusal_without_callback_or_another_persist",
              "gated_heartbeat_retry::absent_destination_parent_returns_a_genuine_non_five_refusal_without_retry",
              "gated_heartbeat_retry::default_sharing_reader_preserves_complete_counters_for_its_actual_native_outcome",
          }

          expected_inventories = {
              "lifecycle": {
                  name for name in expected_tests
                  if not name.startswith("heartbeat_failure_observation::")
              },
              "observer": {
                  name for name in expected_tests
                  if name.startswith("heartbeat_failure_observation::")
              },
          }
          expected_counts = {"lifecycle": 21, "observer": 3}

          try:
              require(os.name == "nt", "native_windows_required")
              require("RUST_TEST_THREADS" not in os.environ, "default_test_parallelism_required")
              head = command(["git", "rev-parse", "HEAD"])
              tree = command(["git", "rev-parse", "HEAD^{tree}"])
              require(head == os.environ["PROBE_EXPECTED_HEAD"], "event_head_mismatch")
              observation = os.environ["PROBE_OBSERVATION_REVISION"]
              observation_tree = os.environ["PROBE_OBSERVATION_TREE"]
              require(
                  command(["git", "rev-parse", observation + "^{tree}"]) == observation_tree,
                  "observation_tree_mismatch",
              )
              require(
                  command(["git", "diff", "--name-only", observation, "HEAD"]).splitlines()
                  == [".github/workflows/ci.yml"],
                  "diagnostic_branch_scope",
              )
              require(
                  command(["git", "rev-parse", "HEAD:crates/locron-cli/tests/windows_lifecycle.rs"])
                  == os.environ["PROBE_LIFECYCLE_BLOB"],
                  "lifecycle_source_blob_mismatch",
              )
              compiler = command(["rustup", "run", "stable", "rustc", "-vV"])
              lint_compiler = command(["rustup", "run", "1.98.0", "rustc", "-vV"])
              require(
                  [line[6:] for line in lint_compiler.splitlines() if line.startswith("host: ")]
                  == ["x86_64-pc-windows-msvc"],
                  "native_lint_compiler_host",
              )
              require("release: 1.98.0" in lint_compiler.splitlines(), "strict_lint_compiler_release")
              hosts = [line[6:] for line in compiler.splitlines() if line.startswith("host: ")]
              require(hosts == ["x86_64-pc-windows-msvc"], "native_compiler_host")
              state.update({
                  "probe_head": head,
                  "probe_tree": tree,
                  "observation_head": observation,
                  "observation_tree": observation_tree,
                  "lifecycle_source_blob": os.environ["PROBE_LIFECYCLE_BLOB"],
                  "compiler": compiler,
                  "cargo": command(["cargo", "+stable", "--version"]),
                  "build_test_toolchain": "stable",
                  "strict_lint_compiler": lint_compiler,
                  "strict_lint_cargo": command(["cargo", "+1.98.0", "--version"]),
                  "strict_lint_toolchain": "1.98.0",
                  "host": hosts[0],
              })
              integrity()
              save()
              print("native-lifecycle-probe source=" + head + " tree=" + tree, flush=True)

              state["phase"] = "strict_native_lifecycle_clippy"
              save()
              lint = logged(
                  ["cargo", "+1.98.0", "clippy", "-p", "locron", "--test", "windows_lifecycle",
                   "--test", "windows_heartbeat_observation", "--locked", "--", "-D", "warnings"],
                  "native-lifecycle-clippy",
              )
              emit(lint)
              state["native_clippy_return_code"] = lint.returncode
              save()
              require(lint.returncode == 0, "native_lifecycle_clippy_failed")

              metadata = json.loads(command(
                  ["cargo", "+stable", "metadata", "--no-deps", "--locked", "--format-version", "1"]
              ))
              package = [
                  item for item in metadata["packages"]
                  if item["name"] == "locron"
                  and pathlib.Path(item["manifest_path"]).resolve()
                  == root / "crates" / "locron-cli" / "Cargo.toml"
              ]
              require(len(package) == 1, "unique_cli_package")
              target_root = pathlib.Path(metadata["target_directory"]).resolve()

              state["phase"] = "real_lifecycle_build"
              save()
              lifecycle = logged(
                  ["cargo", "+stable", "test", "-p", "locron", "--test", "windows_lifecycle",
                   "--no-run", "--locked", "--message-format=json"],
                  "lifecycle-build",
              )
              sys.stderr.write(lifecycle.stderr.decode("utf-8", errors="replace"))
              require(lifecycle.returncode == 0, "lifecycle_build_failed")
              state["artifacts"] = {
                  "lifecycle": select_artifact(
                      lifecycle, "windows_lifecycle", "test", True, package[0]["id"], target_root
                  ),
              }
              integrity()
              save()

              state["phase"] = "real_observer_build"
              save()
              observer = logged(
                  ["cargo", "+stable", "test", "-p", "locron", "--test", "windows_heartbeat_observation",
                   "--no-run", "--locked", "--message-format=json"],
                  "observer-build",
              )
              sys.stderr.write(observer.stderr.decode("utf-8", errors="replace"))
              require(observer.returncode == 0, "observer_build_failed")
              state["artifacts"]["observer"] = select_artifact(
                  observer, "windows_heartbeat_observation", "test", True, package[0]["id"], target_root
              )
              integrity()
              save()

              state["phase"] = "real_cli_build"
              save()
              production = logged(
                  ["cargo", "+stable", "build", "-p", "locron", "--bin", "locron", "--locked",
                   "--message-format=json"],
                  "production-build",
              )
              sys.stderr.write(production.stderr.decode("utf-8", errors="replace"))
              require(production.returncode == 0, "production_build_failed")
              state["artifacts"]["production"] = select_artifact(
                  production, "locron", "bin", False, package[0]["id"], target_root
              )
              integrity()
              save()
              test_env = os.environ.copy()
              test_env["LOCRON_TEST_BINARY"] = state["artifacts"]["production"]["executable"]
              state["test_arguments"] = {
                  role: [state["artifacts"][role]["executable"], "--nocapture"]
                  for role in ("lifecycle", "observer")
              }
              state["test_environment_override"] = {
                  "LOCRON_TEST_BINARY": test_env["LOCRON_TEST_BINARY"]
              }
              integrity()

              state["phase"] = "full_inventories"
              state["test_inventories"] = {}
              save()
              for role in ("lifecycle", "observer"):
                  integrity()
                  executable = state["artifacts"][role]["executable"]
                  inventory = logged([executable, "--list"], role + "-inventory", env=test_env)
                  require(inventory.returncode == 0, role + "_test_inventory_failed")
                  names = re.findall(
                      r"(?m)^(.+): test\r?$", inventory.stdout.decode("utf-8")
                  )
                  require(
                      len(names) == expected_counts[role]
                      and set(names) == expected_inventories[role],
                      role + "_full_test_inventory",
                  )
                  state["test_inventories"][role] = sorted(names)
                  integrity()
                  save()
              inventory_union = set().union(*state["test_inventories"].values())
              require(
                  inventory_union == expected_tests
                  and sum(len(names) for names in state["test_inventories"].values()) == 24
                  and len(inventory_union) == 24,
                  "complete_disjoint_test_inventory_union",
              )
              state["test_inventory"] = sorted(inventory_union)
              save()
              for role, artifact in state["artifacts"].items():
                  print(
                      "native-lifecycle-probe artifact=" + role
                      + " bytes=" + str(artifact["facts"]["size"])
                      + " sha256=" + artifact["facts"]["sha256"],
                      flush=True,
                  )

              for iteration in range(1, 51):
                  state["phase"] = "full_suite_iteration"
                  state["current_iteration"] = iteration
                  receipt = {
                      "iteration": iteration,
                      "return_code": None,
                      "elapsed_ms": 0,
                      "counts": None,
                      "integrity_before": False,
                      "integrity_after": False,
                      "status": "in_progress",
                      "binaries": [],
                  }
                  state["iterations"].append(receipt)
                  save()
                  for role in ("lifecycle", "observer"):
                      state["current_binary"] = role
                      integrity()
                      receipt["integrity_before"] = True
                      save()
                      print(
                          "native-lifecycle-probe iteration=" + str(iteration) + " binary=" + role,
                          flush=True,
                      )
                      started = time.monotonic()
                      result = logged(
                          state["test_arguments"][role],
                          "iteration-" + str(iteration).zfill(2) + "-" + role,
                          env=test_env,
                      )
                      elapsed_ms = int((time.monotonic() - started) * 1000)
                      emit(result)
                      summaries = re.findall(
                          r"(?m)^test result: (ok|FAILED)\. (\d+) passed; (\d+) failed; "
                          r"(\d+) ignored; (\d+) measured; (\d+) filtered out; finished in [^\r\n]+\r?$",
                          result.stdout.decode("utf-8", errors="replace"),
                      )
                      counts = None
                      if len(summaries) == 1:
                          summary = summaries[0]
                          counts = dict(zip(
                              ["passed", "failed", "ignored", "measured", "filtered"],
                              map(int, summary[1:]),
                          ))
                      binary_receipt = {
                          "binary": role,
                          "return_code": result.returncode,
                          "elapsed_ms": elapsed_ms,
                          "counts": counts,
                          "integrity_before": True,
                          "integrity_after": False,
                      }
                      receipt["binaries"].append(binary_receipt)
                      receipt["return_code"] = result.returncode
                      receipt["elapsed_ms"] += elapsed_ms
                      save()
                      try:
                          integrity()
                          binary_receipt["integrity_after"] = True
                      except Exception:
                          # Preserve an actual test failure as the first result even
                          # if its subsequent artifact/source conservation also fails.
                          binary_receipt["integrity_after"] = False
                      receipt["integrity_after"] = all(
                          item["integrity_after"] for item in receipt["binaries"]
                      )
                      save()
                      if result.returncode != 0:
                          receipt["status"] = "first_test_failure"
                          state["status"] = "first_test_failure"
                          state["first_failed_iteration"] = iteration
                          state["first_failed_binary"] = role
                          save()
                          raise SystemExit(1)
                      require(binary_receipt["integrity_after"], "post_binary_integrity_refused")
                      require(
                          counts == {"passed": expected_counts[role], "failed": 0, "ignored": 0,
                                     "measured": 0, "filtered": 0},
                          role + "_incomplete_full_suite_result",
                      )
                  receipt["counts"] = {
                      key: sum(item["counts"][key] for item in receipt["binaries"])
                      for key in ("passed", "failed", "ignored", "measured", "filtered")
                  }
                  require(
                      receipt["counts"] == {"passed": 24, "failed": 0, "ignored": 0,
                                            "measured": 0, "filtered": 0},
                      "incomplete_combined_suite_result",
                  )
                  receipt["status"] = "passed"
                  save()

              state["phase"] = "complete"
              state["status"] = "not_reproduced_in_50_full_suite_observations"
              state["qualification"] = "diagnostic_only_no_cause_or_fix_claim"
              integrity()
              save()
              print("native-lifecycle-probe completed=50 result=not_reproduced", flush=True)
          except Exception:
              state["status"] = "probe_refused"
              save()
              print("native-lifecycle-probe refused phase=" + state["phase"], flush=True)
              raise SystemExit(1)
      - name: Upload native cause probe provenance and actual suite results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-lifecycle-cause-x64-stable
          if-no-files-found: error
          retention-days: 14
          path: ${{ runner.temp }}/lifecycle-cause-probe/
