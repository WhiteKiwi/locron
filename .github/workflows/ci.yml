name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.runner.platform }} / Rust ${{ matrix.rust }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        rust: ["1.94.0", stable]
        runner:
          - platform: linux-x86_64
            os: ubuntu-24.04
          - platform: linux-aarch64
            os: ubuntu-24.04-arm
          - platform: macos-x86_64
            os: macos-15-intel
          - platform: macos-aarch64
            os: macos-14
    runs-on: ${{ matrix.runner.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Record platform
        run: |
          uname -a
          rustc -vV
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace --all-targets

  installer:
    name: Installer / ubuntu-latest
    timeout-minutes: 10
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Shellcheck install.sh
        run: |
          sudo apt-get install -y shellcheck
          shellcheck install.sh
      - name: Shellcheck usage.sh
        run: |
          shellcheck scripts/usage.sh
      - name: Usage snapshot smoke (live APIs)
        run: |
          set -eu
          # GITHUB_TOKEN raises the REST quota, but it lacks the push/admin
          # access the owner-only /traffic/* endpoints require, so a failure
          # confined to the traffic section is expected and permitted.
          sh scripts/usage.sh --json > usage-snapshot.json || code=$?
          jq -e 'all(.. | numbers; . >= 0 and (. % 1) == 0)' usage-snapshot.json
          if [ "${code:-0}" -ne 0 ]; then
            jq -e 'has("traffic_error") and ([keys[] | select(endswith("_error"))] | all(. == "traffic_error"))' usage-snapshot.json
          fi
      - name: Refuse unsupported platforms and musl
        run: |
          set -eu
          mkdir -p fakebin

          cat > fakebin/uname <<'EOF'
          #!/bin/sh
          case "$1" in
            -s) echo "Windows" ;;
            -m) echo "x86_64" ;;
            *) /usr/bin/uname "$@" ;;
          esac
          EOF
          chmod +x fakebin/uname
          if PATH="$PWD/fakebin:$PATH" sh install.sh >unsupported-os.log 2>&1; then
            echo "expected refusal for unsupported OS"; cat unsupported-os.log; exit 1
          fi
          grep -q "unsupported operating system 'Windows'" unsupported-os.log

          cat > fakebin/uname <<'EOF'
          #!/bin/sh
          case "$1" in
            -s) echo "Linux" ;;
            -m) echo "sparc64" ;;
            *) /usr/bin/uname "$@" ;;
          esac
          EOF
          if PATH="$PWD/fakebin:$PATH" sh install.sh >unsupported-arch.log 2>&1; then
            echo "expected refusal for unsupported arch"; cat unsupported-arch.log; exit 1
          fi
          grep -q "unsupported CPU architecture 'sparc64'" unsupported-arch.log

          cat > fakebin/uname <<'EOF'
          #!/bin/sh
          case "$1" in
            -s) echo "Linux" ;;
            -m) echo "x86_64" ;;
            *) /usr/bin/uname "$@" ;;
          esac
          EOF
          cat > fakebin/ldd <<'EOF'
          #!/bin/sh
          echo "musl libc (x86_64)"; exit 0
          EOF
          chmod +x fakebin/ldd
          if PATH="$PWD/fakebin:$PATH" sh install.sh >musl.log 2>&1; then
            echo "expected refusal for musl"; cat musl.log; exit 1
          fi
          grep -q "musl-based Linux is not supported" musl.log
      - name: Install a pinned release on Linux
        run: |
          set -eu
          LOCRON_VERSION=v0.2.0 LOCRON_INSTALL_DIR="$PWD/test-bin/locron" sh install.sh
          "$PWD/test-bin/locron" -V
