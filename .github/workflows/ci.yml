name: CI

on:
  workflow_dispatch:
    inputs:
      full_windows:
        description: Run exploratory full native Windows tests and Clippy
        type: boolean
        required: false
        default: false
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_windows }}
    name: Dashboard frontend / Node 24.21.0
    timeout-minutes: 15
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: crates/locron-server/frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: jdx/mise-action@5228313ee0372e111a38da051671ca30fc5a96db # v3
        env:
          TMPDIR: ${{ runner.temp }}
        with:
          working_directory: crates/locron-server/frontend
          cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Verify committed dashboard assets
        run: |
          git diff --exit-code -- dist
          test -z "$(git ls-files --others -- dist)"

  windows-foundation:
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.full_windows }}
    name: Windows foundation / ${{ matrix.platform }} / Rust ${{ matrix.rust }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x86_64-pc-windows-msvc
            os: windows-2025
            rust: stable
          - platform: aarch64-pc-windows-msvc
            os: windows-11-arm
            rust: stable
          - platform: x86_64-pc-windows-msvc
            os: windows-2025
            rust: 1.94.0
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: ${{ matrix.rust }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
      - uses: Swatinem/rust-cache@v2
        with:
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - name: Verify native toolchain
        shell: pwsh
        run: |
          Get-ComputerInfo -Property WindowsProductName, WindowsVersion, OsArchitecture
          rustc -vV
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hostTriple = (rustc -vV | Select-String '^host: ').ToString().Substring(6)
          if ($hostTriple -ne '${{ matrix.platform }}') { throw "Wrong native toolchain: $hostTriple" }
      - name: Compile staged Windows workspace
        run: cargo check --workspace --locked
      - name: Verify cold core contracts with isolated fault fixtures
        id: native_core
        run: cargo test -p locron-core --lib --locked -- --test-threads=1
      - name: Verify isolated stock adapter policy and parent containment
        shell: pwsh
        run: |
          foreach ($proofMode in @('eof-release-driver', 'restricted-driver', 'parent-exit-driver')) {
            $env:LOCRON_STOCK_LOADER_FIXTURE = $proofMode
            Write-Output "Isolated stock adapter proof: $proofMode"
            cargo test -p locron-core --lib --locked windows::loader_tests::owned_loader_fixture_child -- --exact --nocapture --test-threads=1
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Bind actual production and recovery prune artifacts
        if: ${{ !cancelled() && steps.native_core.outcome == 'success' }}
        env:
          PRUNE_QUALIFICATION_PLATFORM: ${{ matrix.platform }}
          PRUNE_QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PRUNE_QUALIFICATION_STAGE: prune-producer
        shell: pwsh
        run: |
          $program = @'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import struct
          import subprocess
          import sys

          CAP = 8 * 1024 * 1024
          ROOT = pathlib.Path("prune-qualification")
          PHASE = "initial"
          ACTUAL_STATUS = None


          def require(condition, phase):
              global PHASE
              PHASE = phase
              if not condition:
                  raise ValueError("fixed prune qualification refusal")


          def bounded(path, cap=CAP):
              with pathlib.Path(path).open("rb") as stream:
                  value = stream.read(cap + 1)
              require(len(value) <= cap, "capture-cap")
              return value


          def invoke(command, name, environment=None):
              global ACTUAL_STATUS
              with (ROOT / (name + ".stdout")).open("xb") as stdout:
                  with (ROOT / (name + ".stderr")).open("xb") as stderr:
                      status = subprocess.run(command, stdout=stdout, stderr=stderr, env=environment).returncode
              out = bounded(ROOT / (name + ".stdout"))
              err = bounded(ROOT / (name + ".stderr"))
              if name.endswith("tests"):
                  ACTUAL_STATUS = status
                  # Raw owned captures stay in the artifact; public output uses fixed receipts only.
              return status, out, err


          def git(*arguments):
              name = "git-" + str(len(list(ROOT.glob("git-*.stdout"))))
              status, out, _ = invoke(["git", *arguments], name)
              require(status == 0, "git-status")
              return out.decode("ascii").strip()


          def native_host():
              systems = {
                  "linux-x86_64": ("linux", "Linux", "x86_64-unknown-linux-gnu"),
                  "linux-aarch64": ("linux", "Linux", "aarch64-unknown-linux-gnu"),
                  "macos-x86_64": ("macos", "Darwin", "x86_64-apple-darwin"),
                  "macos-aarch64": ("macos", "Darwin", "aarch64-apple-darwin"),
                  "x86_64-pc-windows-msvc": ("windows", "Windows", "x86_64-pc-windows-msvc"),
                  "aarch64-pc-windows-msvc": ("windows", "Windows", "aarch64-pc-windows-msvc"),
              }
              selected = os.environ["PRUNE_QUALIFICATION_PLATFORM"]
              require(selected in systems, "closed-platform")
              key, system, host = systems[selected]
              require(platform.system() == system, "actual-system")
              status, out, _ = invoke(["rustc", "-vV"], "toolchain-" + os.environ["PRUNE_QUALIFICATION_STAGE"])
              matches = re.findall(rb"^host: ([^\r\n]+)\r?$", out, re.MULTILINE)
              require(status == 0 and len(matches) == 1 and matches[0].decode("ascii") == host, "actual-host")
              return key, host


          def revision():
              checkout = git("rev-parse", "HEAD")
              tree = git("rev-parse", "HEAD^{tree}")
              head = os.environ["PRUNE_QUALIFICATION_HEAD"]
              require(all(re.fullmatch(r"[0-9a-f]{40}", value) for value in (checkout, tree, head, os.environ["GITHUB_SHA"])), "revision-shapes")
              require(checkout == os.environ["GITHUB_SHA"], "actual-checkout")
              status, commit, _ = invoke(["git", "cat-file", "-p", checkout], "commit-" + os.environ["PRUNE_QUALIFICATION_STAGE"])
              header = commit.split(b"\n\n", 1)[0]
              parents = [line[7:].decode("ascii") for line in header.splitlines() if line.startswith(b"parent ")]
              require(status == 0 and all(re.fullmatch(r"[0-9a-f]{40}", parent) for parent in parents) and len(parents) == len(set(parents)), "closed-parents")
              event = os.environ["GITHUB_EVENT_NAME"]
              require(event in ("pull_request", "push", "workflow_dispatch"), "closed-event")
              require((len(parents) == 2 and parents.count(head) == 1 and checkout != head) if event == "pull_request" else checkout == head, "head-parent-binding")
              return {"head": head, "tree": tree}, {"checkout": checkout, "parents": parents, "event": event}


          import importlib.machinery
          import importlib.util


          def load_artifact_reader():
              checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              require(pathlib.Path.cwd().resolve(strict=True) == checkout, "fixed-reader-checkout")
              source = checkout / "scripts" / "ci_prune_artifact_facts.py"
              selected = importlib.util.spec_from_file_location("locron_ci_prune_artifact_facts", source)
              require(selected is not None and isinstance(selected.loader, importlib.machinery.SourceFileLoader) and selected.origin == str(source), "fixed-reader-source-loader")
              module = importlib.util.module_from_spec(selected)
              selected.loader.exec_module(module)
              return module


          artifact_reader = load_artifact_reader()
          facts = artifact_reader.facts
          binding_json_facts = artifact_reader.binding_json_facts


          def metadata(name, environment=None):
              status, out, _ = invoke(["cargo", "metadata", "--locked", "--no-deps", "--format-version", "1"], name, environment)
              require(status == 0, "metadata-status")
              return json.loads(out)


          def artifact(messages, package_id, name, kind, test):
              values = []
              for line in messages.splitlines():
                  message = json.loads(line)
                  if message.get("reason") == "compiler-artifact" and message.get("package_id") == package_id and message.get("target", {}).get("name") == name and message["target"]["kind"] == [kind] and message.get("profile", {}).get("test") is test and message.get("executable"):
                      values.append(message)
              require(len(values) == 1, "one-actual-artifact")
              return values[0]


          def package(data, name):
              matches = [value for value in data["packages"] if value["name"] == name]
              require(len(matches) == 1, "one-package")
              return matches[0]["id"]


          def totals(text, expected):
              matches = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out", text)
              require(len(matches) == 1 and tuple(map(int, matches[0][:4])) == (expected, 0, 0, 0), "actual-nonzero-summary")


          def checked_records(data):
              require(set(data) == {"version", "revision", "production", "recovery"} and data["version"] == 1, "closed-binding")
              require(set(data["revision"]) == {"head", "tree"} and all(re.fullmatch(r"[0-9a-f]{40}", value) for value in data["revision"].values()), "closed-revision")
              for name, test in (("production", False), ("recovery", True)):
                  record = data[name]
                  require(set(record) == {"path", "sha256", "size", "profile_test"} and record["profile_test"] is test and re.fullmatch(r"[0-9a-f]{64}", record["sha256"]) and type(record["size"]) is int and 0 < record["size"] <= 512 * 1024 * 1024, "closed-artifact-record")
              require(data["production"]["path"] != data["recovery"]["path"], "distinct-artifacts")


          def bind_again(binding, host):
              for name in ("production", "recovery"):
                  actual, _ = facts(binding[name]["path"], host)
                  require(all(actual[field] == binding[name][field] for field in ("path", "sha256", "size")), "independent-binding-recheck")
          def main():
              ROOT.mkdir()
              _, host = native_host()
              selected_revision, checkout = revision()
              local = os.environ.get("LOCALAPPDATA", "")
              require(bool(local) and pathlib.Path(local).is_absolute() and not any(char in local for char in "\r\n\0"), "absolute-local-build-root")
              identifiers = [os.environ.get(name, "") for name in ("GITHUB_RUN_ID", "GITHUB_RUN_ATTEMPT", "GITHUB_JOB")]
              row = "${{ matrix.platform }}-${{ matrix.rust }}"
              patterns = (r"[0-9]+", r"[0-9]+", r"[A-Za-z0-9_-]+", r"[A-Za-z0-9_.-]+")
              require(all(re.fullmatch(pattern, value) is not None for pattern, value in zip(patterns, [*identifiers, row])), "local-build-identifiers")
              namespace = pathlib.Path(local) / ("locron-guard-b-" + "-".join([*identifiers, row]))
              namespace.mkdir()
              production_target = namespace / "production-target"
              require(production_target.is_absolute() and not production_target.exists(), "fresh-production-target")
              production_target.mkdir()
              copied = os.environ.copy()
              copied["CARGO_TARGET_DIR"] = str(production_target)
              recovery_target = namespace / "recovery-target"
              recovery_target.mkdir()
              recovery_environment = os.environ.copy()
              recovery_environment["CARGO_TARGET_DIR"] = str(recovery_target)
              production_metadata = metadata("production-metadata", copied)
              require(pathlib.Path(production_metadata["target_directory"]).resolve(strict=True) == production_target.resolve(strict=True), "production-target-binding")
              status, messages, _ = invoke(["cargo", "build", "-p", "locron", "--bin", "locron", "--locked", "--message-format=json", "--target-dir", str(production_target)], "production-build", copied)
              require(status == 0, "production-build-status")
              production = artifact(messages, package(production_metadata, "locron"), "locron", "bin", False)
              production_path = pathlib.Path(production["executable"])
              require(production_path.parent.name == "debug" and production_path.parent.parent.resolve(strict=True) == production_target.resolve(strict=True), "default-production-placement")
              tests_metadata = metadata("recovery-metadata", recovery_environment)
              test_target = pathlib.Path(tests_metadata["target_directory"]).resolve()
              require(test_target.resolve(strict=True) == recovery_target.resolve(strict=True), "recovery-target-binding")
              require(test_target != production_target.resolve(strict=True), "separate-test-target")
              status, messages, _ = invoke(["cargo", "test", "-p", "locron", "--bin", "locron", "--locked", "--no-run", "--message-format=json", "--target-dir", str(recovery_target)], "recovery-build", recovery_environment)
              require(status == 0, "recovery-build-status")
              recovery = artifact(messages, package(tests_metadata, "locron"), "locron", "bin", True)
              recovery_path = pathlib.Path(recovery["executable"])
              recovery_path.resolve(strict=True).relative_to(test_target.resolve(strict=True))
              prod, prod_id = facts(production_path, host)
              rec, rec_id = facts(recovery_path, host)
              require(prod_id != rec_id, "distinct-full-artifact-identities")
              binding = {"version": 1, "revision": selected_revision, "production": dict(prod, profile_test=False), "recovery": dict(rec, profile_test=True)}
              checked_records(binding)
              locator = production_target / "prune-artifact-binding.json"
              encoded = (json.dumps(binding, sort_keys=True, separators=(",", ":")) + "\n").encode("utf-8")
              require(len(encoded) <= 32768, "binding-cap")
              with locator.open("xb") as stream:
                  stream.write(encoded)
                  stream.flush()
                  os.fsync(stream.fileno())
              actual_binding, actual_encoded, binding_id, binding_sha = binding_json_facts(production_path, recovery_path, host, selected_revision)
              require(actual_binding == binding and actual_encoded == encoded, "binding-write-readback")
              bind_again(binding, host)
              with pathlib.Path(os.environ["GITHUB_ENV"]).open("a", encoding="utf-8") as stream:
                  stream.write("LOCRON_PRUNE_TEST_BINARY=" + prod["path"] + "\n")
                  stream.write("LOCRON_PRUNE_RECOVERY_TEST_BINARY=" + rec["path"] + "\n")
                  stream.write("LOCRON_PRUNE_RECOVERY_CARGO_TARGET_DIR=" + str(recovery_target) + "\n")
              receipt = {"revision": selected_revision, "checkout": checkout, "native_host": host, "production_artifact": production, "recovery_artifact": recovery, "production_identity": prod_id, "recovery_identity": rec_id, "production_target": str(production_target), "test_target": str(test_target), "binding_sha256": binding_sha, "binding_identity": binding_id}
              (ROOT / "producer.json").write_text(json.dumps(receipt, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("prune-artifact-binding PASS production=1 recovery=1")


          try:
              main()
          except Exception as error:
              print("prune-artifact-binding FAIL phase=" + PHASE + " kind=" + type(error).__name__, file=sys.stderr)
              sys.exit(1)
          '@
          $program | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify durable store and runtime library contracts
        if: ${{ !cancelled() && steps.native_core.outcome == 'success' }}
        env:
          CARGO_TARGET_DIR: ${{ env.LOCRON_PRUNE_RECOVERY_CARGO_TARGET_DIR }}
        run: |
          python -c "import os, pathlib, sys; value = os.environ.get('CARGO_TARGET_DIR', ''); sys.exit(0 if value and pathlib.Path(value).is_absolute() else 'missing or relative qualification target')"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test -p locron-store -p locron-engine -p locron-server --lib --locked
      - name: Qualify retained Engine output and bounded repair receipts
        env:
          CARGO_TARGET_DIR: ${{ env.LOCRON_PRUNE_RECOVERY_CARGO_TARGET_DIR }}
          ENGINE_QUALIFICATION_PLATFORM: ${{ matrix.platform }}
          ENGINE_QUALIFICATION_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: pwsh
        run: |
          $program = @'
          import collections
          import hashlib
          import json
          import os
          import pathlib
          import platform
          import re
          import struct
          import subprocess
          import sys

          CAP = 8 * 1024 * 1024
          ROOT = pathlib.Path("engine-output-qualification")
          PHASE = "initial"
          ACTUAL_TEST_STATUS = None


          def require(condition, phase):
              global PHASE
              PHASE = phase
              if not condition:
                  raise ValueError("fixed qualification refusal")


          def bounded(path, cap=CAP):
              global PHASE
              PHASE = "bounded-capture"
              with path.open("rb") as stream:
                  data = stream.read(cap + 1)
              require(len(data) <= cap, "capture-cap")
              return data


          def invoke(command, name):
              global PHASE, ACTUAL_TEST_STATUS
              PHASE = "actual-" + name
              with (ROOT / (name + ".stdout")).open("xb") as stdout:
                  with (ROOT / (name + ".stderr")).open("xb") as stderr:
                      status = subprocess.run(command, stdout=stdout, stderr=stderr).returncode
              if name == "tests":
                  ACTUAL_TEST_STATUS = status
              out = bounded(ROOT / (name + ".stdout"))
              err = bounded(ROOT / (name + ".stderr"))
              if name in ("build", "tests"):
                  sys.stdout.write(out.decode("utf-8", errors="backslashreplace"))
                  sys.stderr.write(err.decode("utf-8", errors="backslashreplace"))
              return status, out


          def git(*arguments):
              status, data = invoke(["git", *arguments], "git-" + str(len(list(ROOT.glob("git-*.stdout")))))
              require(status == 0, "git-status")
              return data.decode("ascii").strip()


          def executable_facts(path, host):
              global PHASE
              PHASE = "executable-identity"
              initial = path.stat()
              require(path.is_file() and 0 < initial.st_size <= 512 * 1024 * 1024, "executable-size")
              arch = host.split("-")[0]
              with path.open("rb") as stream:
                  header = stream.read(64)
                  if host.endswith("windows-msvc"):
                      require(header[:2] == b"MZ" and len(header) == 64, "native-pe-header")
                      offset = struct.unpack_from("<I", header, 60)[0]
                      require(offset <= 1024 * 1024 and offset + 6 <= initial.st_size, "native-pe-offset")
                      stream.seek(offset)
                      pe = stream.read(6)
                      require(pe[:4] == b"PE\0\0" and struct.unpack_from("<H", pe, 4)[0] == {"x86_64": 0x8664, "aarch64": 0xAA64}[arch], "native-pe-machine")
                  elif host.endswith("apple-darwin"):
                      require(header[:4] == b"\xcf\xfa\xed\xfe" and struct.unpack_from("<I", header, 4)[0] == {"x86_64": 0x01000007, "aarch64": 0x0100000C}[arch], "native-mach-machine")
                  else:
                      require(header[:6] == b"\x7fELF\x02\x01" and struct.unpack_from("<H", header, 18)[0] == {"x86_64": 62, "aarch64": 183}[arch], "native-elf-machine")
                  stream.seek(0)
                  digest = hashlib.sha256()
                  total = 0
                  while True:
                      part = stream.read(64 * 1024)
                      if not part:
                          break
                      total += len(part)
                      require(total <= 512 * 1024 * 1024, "executable-hash-cap")
                      digest.update(part)
              final = path.stat()
              require(total == initial.st_size and (initial.st_size, initial.st_mtime_ns) == (final.st_size, final.st_mtime_ns), "executable-stable")
              return {"sha256": digest.hexdigest(), "bytes": total, "native_host": host}


          import importlib.machinery
          import importlib.util


          def load_artifact_reader():
              checkout = pathlib.Path(os.environ["GITHUB_WORKSPACE"]).resolve(strict=True)
              require(pathlib.Path.cwd().resolve(strict=True) == checkout, "fixed-reader-checkout")
              source = checkout / "scripts" / "ci_prune_artifact_facts.py"
              selected = importlib.util.spec_from_file_location("locron_ci_prune_artifact_facts", source)
              require(selected is not None and isinstance(selected.loader, importlib.machinery.SourceFileLoader) and selected.origin == str(source), "fixed-reader-source-loader")
              module = importlib.util.module_from_spec(selected)
              selected.loader.exec_module(module)
              return module


          artifact_reader = load_artifact_reader()
          retained_artifact_facts = artifact_reader.facts


          def complete_output_union(metadata, host, key_platform, ledger, engine_record):
              global ACTUAL_TEST_STATUS
              union = set(engine_record["completed_keys"])
              details = {"engine": engine_record}
              target_root = pathlib.Path(metadata["target_directory"]).resolve(strict=True)
              for module, package_name, target_name, target_kind, build_arguments, test_arguments, test_count in (
                  ("store", "locron-store", "locron_store", "lib", ["--lib"], ["output::qualification::", "--nocapture"], 5),
                  ("caller", "locron", "locron", "bin", ["--bin", "locron"], ["--exact", "maintenance::tests::output_repair_qualification::caller_contracts", "--nocapture"], 1),
              ):
                  packages = [package for package in metadata["packages"] if package["name"] == package_name]
                  require(len(packages) == 1, "output-one-actual-" + module + "-package")
                  status, messages = invoke(["cargo", "test", "-p", package_name, *build_arguments, "--locked", "--no-run", "--message-format=json"], module + "-build")
                  require(status == 0, "output-actual-" + module + "-build")
                  artifacts = []
                  for line in messages.splitlines():
                      message = json.loads(line)
                      if message.get("reason") == "compiler-artifact" and message.get("package_id") == packages[0]["id"] and message.get("target", {}).get("name") == target_name and message["target"]["kind"] == [target_kind] and message.get("profile", {}).get("test") is True and message.get("executable"):
                          artifacts.append(message)
                  require(len(artifacts) == 1, "output-one-actual-" + module + "-artifact")
                  artifact = artifacts[0]
                  executable = pathlib.Path(artifact["executable"]).resolve(strict=True)
                  executable.relative_to(target_root)
                  before = retained_artifact_facts(executable, host)
                  expected_rows = [row for row in ledger["rows"] if row["module"] == module and row["platform"] in ("all", "windows" if key_platform == "windows" else "unix")]
                  expected = {row["key"] for row in expected_rows}
                  require(len(expected) == (6 if module == "caller" else 42 if key_platform == "windows" else 41), "output-platform-count")
                  status, raw = invoke([str(executable), *test_arguments], module + "-tests")
                  ACTUAL_TEST_STATUS = status
                  text = raw.decode("utf-8")
                  observed = collections.Counter(re.findall(r"output-qualification PASS ([A-Za-z0-9:_-]+)", text))
                  require(set(observed) == expected and all(value == 1 for value in observed.values()), "output-exact-" + module + "-keys")
                  totals = re.findall(r"test result: ok\. (\d+) passed; (\d+) failed; (\d+) ignored; (\d+) measured; (\d+) filtered out", text)
                  require(status == 0 and len(totals) == 1 and tuple(map(int, totals[0][:4])) == (test_count, 0, 0, 0), "output-actual-" + module + "-status-total")
                  require(retained_artifact_facts(executable, host) == before, "output-artifact-conserved")
                  require(not union.intersection(observed), "output-disjoint-key-domains")
                  union.update(observed)
                  details[module] = {"package_id": packages[0]["id"], "target": artifact["target"], "profile": artifact["profile"], "executable": before, "completed_keys": sorted(observed), "actual_test_status": status, "actual_test_totals": {"passed": test_count, "failed": 0, "ignored": 0, "measured": 0}, "stdout_sha256": hashlib.sha256(raw).hexdigest(), "stderr_sha256": hashlib.sha256(bounded(ROOT / (module + "-tests.stderr"))).hexdigest()}
              all_rows = [row for row in ledger["rows"] if row["platform"] in ("all", "windows" if key_platform == "windows" else "unix", key_platform)]
              require(union == {row["key"] for row in all_rows} and len(union) == {"linux": 92, "macos": 89, "windows": 91}[key_platform], "exact-output96-platform-union")
              record = {"revision": engine_record["revision"], "tree": engine_record["tree"], "head": engine_record["head"], "native_host": host, "ledger_sha256": engine_record["ledger_sha256"], "completed_keys": sorted(union), "modules": details}
              (ROOT / "output96-receipt.json").write_text(json.dumps(record, indent=2, sort_keys=True) + "\n", encoding="utf-8")
              print("output96-receipt PASS keys=" + str(len(union)) + " drivers=" + str({"linux": 16, "macos": 14, "windows": 15}[key_platform]))


          def main():
              global PHASE, ACTUAL_TEST_STATUS
              ROOT.mkdir()
