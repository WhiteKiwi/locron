name: Windows real-user prerequisite

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows-real-user-prerequisite:
    name: Manual real-user prerequisite / ${{ matrix.target }} / Rust 1.94.0
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-pc-windows-msvc
            os: windows-2025
          - target: aarch64-pc-windows-msvc
            os: windows-11-arm
    runs-on: ${{ matrix.os }}
    env:
      RUSTUP_TOOLCHAIN: 1.94.0
      LOCRON_PREREQUISITE_MODE: two-user-v1
      LOCRON_PREREQUISITE_TARGET: ${{ matrix.target }}
      LOCRON_PREREQUISITE_BASE_SHA: 2f7cea6934de0faa873d8301d58ff98fe07abab0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.94.0
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.8.2
        with:
          save-if: false
      - name: Verify exact source and native compiler
        env:
          LOCRON_PREREQUISITE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: cmd
        run: |
          @echo off
          if not "%GITHUB_ACTIONS%"=="true" exit /b 1
          if not "%LOCRON_PREREQUISITE_RUNNER_ENVIRONMENT%"=="github-hosted" exit /b 1
          set "PREREQUISITE_SOURCE="
          for /f %%S in ('git rev-parse HEAD') do set "PREREQUISITE_SOURCE=%%S"
          if not "%PREREQUISITE_SOURCE%"=="%GITHUB_SHA%" exit /b 1
          rustc +1.94.0 -vV
          if errorlevel 1 exit /b 1
          set "PREREQUISITE_HOST="
          set "PREREQUISITE_RELEASE="
          for /f "tokens=2" %%H in ('rustc +1.94.0 -vV ^| findstr /B "host:"') do set "PREREQUISITE_HOST=%%H"
          for /f "tokens=2" %%V in ('rustc +1.94.0 -vV ^| findstr /B "release:"') do set "PREREQUISITE_RELEASE=%%V"
          if not "%PREREQUISITE_HOST%"=="%LOCRON_PREREQUISITE_TARGET%" exit /b 1
          if not "%PREREQUISITE_RELEASE%"=="1.94.0" exit /b 1
      - name: Build the normal prerequisite example
        shell: cmd
        run: cargo +1.94.0 build -p locron-engine --example windows_user_prerequisite --locked --target ${{ matrix.target }}
      - name: Verify two actual credential identities and owned descendant trees
        env:
          LOCRON_PREREQUISITE_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        shell: cmd
        run: '"%SystemRoot%\System32\WindowsPowerShell\v1.0\powershell.exe" -NoLogo -NoProfile -NonInteractive -File scripts/test-windows-user-prerequisite.ps1 -HostedPrerequisite'
      - name: Upload bounded sanitized prerequisite evidence
        if: ${{ always() && !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: real-user-prerequisite-${{ matrix.target }}-${{ github.sha }}
          path: |
            prerequisite-evidence/receipt.json
            prerequisite-evidence/built-example.json
          if-no-files-found: error
          retention-days: 7
