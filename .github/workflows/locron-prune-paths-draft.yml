name: Prepare canonical CLI prune Draft
'on':
  push:
    branches: [fix/cli-prune-canonical-removal]
    paths: [.github/workflows/locron-prune-paths-draft.yml]
permissions: {}
jobs:
  prepare-source:
    if: github.repository == 'WhiteKiwi/locron' && github.ref == 'refs/heads/fix/cli-prune-canonical-removal'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Prepare exact source candidate without updating branch refs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import base64
          import difflib
          import hashlib
          import json
          import os
          import subprocess

          REPO = 'WhiteKiwi/locron'
          BRANCH = 'fix/cli-prune-canonical-removal'
          PATH = 'crates/locron-cli/src/main.rs'
          HELPER = 'crates/locron-cli/src/explicit_prune.rs'
          WORKFLOW = '.github/workflows/locron-prune-paths-draft.yml'
          EXPECTED = '2f14edf8a3e05ea1420f96259ca709616b253d6d'

          def api(method, endpoint, payload=None):
              command = ['gh', 'api', '--method', method, endpoint]
              if payload is not None:
                  command.extend(['--input', '-'])
              result = subprocess.run(command, input=None if payload is None else json.dumps(payload),
                                      text=True, capture_output=True, timeout=45)
              if result.returncode:
                  raise RuntimeError(f'GitHub {method} {endpoint} failed: {result.stderr}')
              return json.loads(result.stdout)

          def blob_sha(data):
              return hashlib.sha1(b'blob ' + str(len(data)).encode() + b'\0' + data).hexdigest()

          assert os.environ['GITHUB_REPOSITORY'] == REPO
          assert os.environ['GITHUB_REF'] == 'refs/heads/' + BRANCH
          head = os.environ['GITHUB_SHA']
          prefix = f'repos/{REPO}'
          ref = f'{prefix}/git/refs/heads/{BRANCH}'
          assert api('GET', ref)['object']['sha'] == head, 'branch changed before source read'
          commit = api('GET', f'{prefix}/git/commits/{head}')
          tree = api('GET', f"{prefix}/git/trees/{commit['tree']['sha']}?recursive=1")
          assert not tree.get('truncated')
          entries = {item['path']: item for item in tree['tree'] if item['type'] != 'tree'}
          assert entries[PATH]['sha'] == EXPECTED and entries[PATH]['mode'] == '100644'
          assert entries[HELPER]['type'] == 'blob' and entries[HELPER]['mode'] == '100644'
          assert entries[WORKFLOW]['type'] == 'blob' and entries[WORKFLOW]['mode'] == '100644'
          source = api('GET', f'{prefix}/git/blobs/{EXPECTED}')
          assert source['encoding'] == 'base64'
          raw = base64.b64decode(source['content'])
          assert blob_sha(raw) == EXPECTED
          text = raw.decode('utf-8')
          old = '''    if !dry_run {
                  for candidate in &candidates {
                      #[cfg(windows)]
                      let path = {
                          let attempt = u16::try_from(candidate.attempt_number)?;
                          let path = paths.final_output(&candidate.run_id, attempt)?;
                          if candidate.relative_path != format!("{}/{attempt}.log", candidate.run_id) {
                              return Err(anyhow!(
                                  "database output path is not the canonical final path"
                              ));
                          }
                          path
                      };
                      store.mark_output_prune_pending(candidate, now_us())?;
                      #[cfg(not(windows))]
                      let path = paths.outputs.join(&candidate.relative_path);
                      #[cfg(windows)]
                      locron_core::filesystem::remove_private_file(&path)?;
                      #[cfg(not(windows))]
                      match std::fs::symlink_metadata(&path) {
                          Ok(metadata) if metadata.file_type().is_symlink() => {
                              return Err(anyhow!("refusing to prune symbolic-link output"));
                          }
                          Ok(metadata) if metadata.is_file() => std::fs::remove_file(&path)?,
                          Ok(_) => return Err(anyhow!("refusing to prune non-file output")),
                          Err(error) if error.kind() == std::io::ErrorKind::NotFound => {}
                          Err(error) => return Err(error.into()),
                      }
                      store.finish_output_prune(candidate, now_us())?;
                  }
              }
              let outputs = candidates.len();
          '''
          new = '''    let planned_paths = explicit_prune::validated_paths(paths, &candidates)?;
              if !dry_run {
                  for (candidate, path) in candidates.iter().zip(&planned_paths) {
                      store.mark_output_prune_pending(candidate, now_us())?;
                      explicit_prune::remove_output(paths, path)?;
                      store.finish_output_prune(candidate, now_us())?;
                  }
              }
              let outputs = candidates.len();
          '''
          # YAML strips the shared ten-space run-block indent. The literal lines
          # retain exactly the Rust indentation shown in the reviewed source.
          module_before = 'mod maintenance;\nmod mcp;\n'
          module_after = 'mod explicit_prune;\nmod maintenance;\nmod mcp;\n'
          assert text.count(old) == 1, 'unexpected prune deletion block'
          assert text.count(module_before) == 1 and 'mod explicit_prune;' not in text
          updated_text = text.replace(old, new, 1).replace(module_before, module_after, 1)
          assert updated_text.count(new) == 1 and updated_text.count(module_after) == 1
          restored = updated_text.replace(module_after, module_before, 1).replace(new, old, 1)
          assert restored == text, 'inverse source comparison failed'
          updated = updated_text.encode('utf-8')
          print(''.join(difflib.unified_diff(text.splitlines(True), updated_text.splitlines(True),
                                           fromfile=PATH, tofile=PATH)))
          blob = api('POST', f'{prefix}/git/blobs', {'content': updated_text, 'encoding': 'utf-8'})
          assert blob['sha'] == blob_sha(updated)
          new_tree = api('POST', f'{prefix}/git/trees', {
              'base_tree': commit['tree']['sha'],
              'tree': [
                  {'path': PATH, 'mode': '100644', 'type': 'blob', 'sha': blob['sha']},
                  {'path': WORKFLOW, 'mode': '100644', 'type': 'blob', 'sha': None},
              ],
          })
          readback = api('GET', f"{prefix}/git/trees/{new_tree['sha']}?recursive=1")
          assert not readback.get('truncated')
          new_entries = {item['path']: item for item in readback['tree'] if item['type'] != 'tree'}
          assert set(new_entries) == set(entries) - {WORKFLOW}
          for path, entry in new_entries.items():
              expected_sha = blob['sha'] if path == PATH else entries[path]['sha']
              assert (entry['sha'], entry['mode']) == (expected_sha, entries[path]['mode'])
          assert api('GET', ref)['object']['sha'] == head, 'branch changed before candidate creation'
          result = api('POST', f'{prefix}/git/commits', {
              'message': 'fix: preflight and guard explicit CLI prune paths',
              'tree': new_tree['sha'], 'parents': [head],
          })
          print(json.dumps({'candidate_commit': result['sha'], 'source_blob': blob['sha'],
                            'helper_blob': entries[HELPER]['sha'],
                            'temporary_workflow_removed_from_candidate': True,
                            'branch_updated': False, 'rust_tests_executed': False}))
