name: Verify cancellation preview candidate
on:
  push:
    branches: [automation/mcp-161-validation]
    paths: ['.github/workflows/mcp-161-validation.yml']
permissions:
  contents: read
concurrency:
  group: verify-mcp-161
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.98.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 640c3aa971f66a3a2aa32aa07034ad79b598fa89
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@7e38f4b43b4db5c8dd498af069a4f6196df1d067
        with:
          toolchain: 1.98.0
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          save-if: false
      - name: Verify exact source and formatting
        run: |
          test "$(git rev-parse HEAD)" = 640c3aa971f66a3a2aa32aa07034ad79b598fa89
          test ! -e .github/workflows/mcp-161-validation.yml
          cargo fmt --all --check
          git diff --check
      - name: Test all actual MCP subprocess regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p locron --test mcp -- --test-threads=1
      - name: Test all MCP unit regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p locron --bin locron mcp:: -- --test-threads=1
      - name: Test all migrated Store regressions
        if: ${{ !cancelled() }}
        run: cargo test --locked -p locron-store --lib -- --test-threads=1
      - name: Check CLI and MCP warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p locron --bin locron --test mcp -- -D warnings
      - name: Check Store warnings
        if: ${{ !cancelled() }}
        run: cargo clippy --locked -p locron-store --lib --tests -- -D warnings
