name: Feature request
description: Propose new behavior, or a change to behavior that works as designed today
title: "feat: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        This project is documentation-first: an accepted proposal becomes a change to
        [`docs/SPEC.md`](https://github.com/WhiteKiwi/locron/blob/main/docs/SPEC.md) before any
        code is written. Describing the **problem** precisely matters more than describing a
        solution — see [CONTRIBUTING.md](https://github.com/WhiteKiwi/locron/blob/main/CONTRIBUTING.md).

  - type: checkboxes
    id: preflight
    attributes:
      label: Preflight
      options:
        - label: I searched the existing issues and this is not a duplicate.
          required: true
        - label: I checked the CLI reference and operator guide to confirm this is not already possible.
          required: true

  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: |
        Describe the situation you are actually in, not the feature you want. What are you doing
        today, and where does it break down?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behavior
      description: What locron should do. Observable behavior, not implementation.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scheduling (cron, interval, one-time, catch-up, DST)
        - Execution targets (process, shell, HTTP)
        - Policies (overlap, retry, concurrency, timeouts)
        - Storage, history, and retention
        - CLI surface and output formats
        - MCP server
        - Daemon lifecycle and recovery
        - Packaging and distribution
        - Documentation
        - Other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives you considered
      description: Including workarounds you are using now, and why they are not enough.

  - type: checkboxes
    id: compatibility
    attributes:
      label: Compatibility
      options:
        - label: This would change existing documented behavior, output format, or on-disk state.
        - label: I would be willing to work on this.
