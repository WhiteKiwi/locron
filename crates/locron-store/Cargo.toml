[package]
name = "locron-store"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[dependencies]
crc32fast = "1.5"
locron-core = { path = "../locron-core" }
rusqlite = { version = "0.40", default-features = false, features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
uuid = { version = "1", features = ["serde", "v7"] }

[dev-dependencies]
tempfile = "3"
