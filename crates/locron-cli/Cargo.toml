[package]
name = "locron-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "Command-line interface and composition root for locron"

[[bin]]
name = "locron"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
async-trait.workspace = true
base64.workspace = true
clap.workspace = true
dialoguer = { version = "0.12", default-features = false }
flate2.workspace = true
futures-util.workspace = true
jiff.workspace = true
locron-core = { path = "../locron-core" }
locron-engine = { path = "../locron-engine" }
locron-store = { path = "../locron-store" }
reqwest.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tar.workspace = true
tokio.workspace = true
tokio-util.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true
uuid.workspace = true

[dev-dependencies]
assert_cmd = "2.1"
predicates = "3.1"
tempfile.workspace = true

[lints]
workspace = true

[package.metadata.deb]
name = "locron"
maintainer = "WhiteKiwi"
copyright = "2026, WhiteKiwi"
license-file = ["../../LICENSE-MIT", "4"]
extended-description = "A local-first job scheduler for macOS and Linux."
section = "utils"
priority = "optional"
maintainer-scripts = "deb-maintainer-scripts"
assets = [
    ["../../target/release/locron", "usr/bin/locron", "755"],
    ["../../README.md", "usr/share/doc/locron/README.md", "644"],
    ["../../LICENSE-MIT", "usr/share/doc/locron/LICENSE-MIT", "644"],
    ["../../LICENSE-APACHE", "usr/share/doc/locron/LICENSE-APACHE", "644"],
]

[package.metadata.generate-rpm]
name = "locron"
summary = "Local-first job scheduler for macOS and Linux"
license = "MIT OR Apache-2.0"
assets = [
    { source = "target/release/locron", dest = "/usr/bin/locron", mode = "755" },
    { source = "README.md", dest = "/usr/share/doc/locron/README.md", mode = "644" },
    { source = "LICENSE-MIT", dest = "/usr/share/doc/locron/LICENSE-MIT", mode = "644" },
    { source = "LICENSE-APACHE", dest = "/usr/share/doc/locron/LICENSE-APACHE", mode = "644" },
]
scripts = { postin = "rpm-scripts/postin" }
