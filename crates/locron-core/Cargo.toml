[package]
name = "locron-core"
version = "0.1.1"
edition = "2024"
rust-version = "1.94"
license = "MIT"
description = "Domain model and deterministic scheduling policy for locron"

[dependencies]
jiff = { version = "0.2", features = ["serde"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
url.workspace = true
uuid = { version = "1", features = ["v7", "serde"] }

[dev-dependencies]
proptest = "1"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
doc_markdown = "allow"
missing_errors_doc = "allow"
